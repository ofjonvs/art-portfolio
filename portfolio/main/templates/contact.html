{% extends 'base.html' %}
{% block content %}
<div class="contact">
  <h2>Contact Me</h2>
  <p>
    If you have any questions or would like to get in touch, please fill out the form below and I will respond as quickly as possible.
  </p>
  <form action="{% url 'contact' %}" method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Send Message</button>
  </form>
</div>

{% endblock %}
